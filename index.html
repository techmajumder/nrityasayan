:root {

    --gold: #e2b866;
    --gold-light: #f7dfa7;
    --gold-dark: #9b6c2e;

    --ivory: #f8f0df;
    --cream: #d8c6aa;

    --maroon: #5b171f;

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--black);
    color: var(--ivory);

    overflow-x: hidden;
}

body.lock {
    overflow: hidden;
}

a {
    text-decoration: none;
    color: inherit;
}

img {

    display: block;
}

========================================================= */

.progress {

    left: 0;

    width: 0;
    height: 3px;

    z-index: 9999;
}

========================================================= */

.hero {

    background-size: cover;

    background-position: center center;

    background-repeat: no-repeat;
}


/* =========================================================
   NAVIGATION

========================================================= */

.nav {

    top: 0;
    left: 0;

    width: 100%;

    z-index: 50;

    display: flex;

    justify-content: flex-end;

    padding: 32px 5vw;

    background: transparent;
}

.nav-links {

    display: flex;

    gap: 42px;

    list-style: none;
}

.nav-links a {

    position: relative;

    font-weight: 600;

    transition:
        color .3s ease,
        transform .3s ease;
}

.nav-links a::after {

    content: "";

    position: absolute;

    left: 0;
    bottom: -9px;

    width: 0;
    height: 1px;

    background: var(--gold-light);

    transition: width .35s ease;
}

.nav-links a:hover {

    color: #fff1c5;

    transform: translateY(-2px);
}

.nav-links a:hover::after {

    width: 100%;
}


/* =========================================================
   HERO READABILITY LAYER

   Does not replace the background image.
========================================================= */

.hero-vignette {

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:

            90deg,
            rgba(0,0,0,.18),

            rgba(0,0,0,.12)

    z-index: 1;
}

   HERO CONTENT
========================================================= */

.hero-content {

    left: 7vw;

    bottom: 12vh;

    max-width: 550px;
}

========================================================= */

.hero-overline {

    align-items: center;

    gap: 13px;

    margin-bottom: 18px;

    color: var(--gold-light);

    font-size: 10px;

    font-weight: 600;

    letter-spacing: .35em;

    text-transform: uppercase;

    text-shadow:
        0 2px 8px rgba(0,0,0,.9);
}

.hero-overline::before {

    content: "";

    width: 42px;

    height: 1px;

    background: var(--gold);
}


/* =========================================================
   MAIN NAME
========================================================= */

.hero-name {

    font-family: var(--serif);

    font-size: clamp(80px, 11vw, 160px);

    line-height: .72;

.hero-name span {

.hero-name .gold {

   SCRIPT LINE
========================================================= */

.hero-script {

.hero-button {

    font-size: 10px;

    font-weight: 600;

    text-transform: uppercase;

.hero-button:hover {

========================================================= */

.hero-label {

.scroll {

    gap: 8px;

    color: var(--gold-light);

    font-size: 8px;

    letter-spacing: .3em;

    text-transform: uppercase;

    text-shadow:
        0 2px 7px rgba(0,0,0,.9);
}

.scroll-line {

    width: 1px;

    height: 42px;

    background:
        linear-gradient(
            to bottom,
            var(--gold),
            transparent
        );

    animation:
        scroll 2s infinite;
}


/* =========================================================
   GENERAL SECTIONS
========================================================= */

.section {

    padding: 140px 7vw;

    position: relative;

    overflow: hidden;
}

.section-inner {

    width: min(1250px, 100%);

    margin: auto;
}

.black-section {

    background: var(--black);
}

.red-section {

    background:

        ),
        var(--maroon-dark);
}


/* =========================================================

.section-label {

.section-title {

}

.philosophy-title {

    font-family: var(--serif);

    font-size: clamp(45px, 6vw, 82px);

    line-height: .95;

    font-weight: 400;
}

.philosophy-title span {

    color: var(--gold-light);

    font-style: italic;
}

   JOURNEY
========================================================= */

.journey-top {

    display: flex;

    justify-content: space-between;

    align-items: end;

    gap: 50px;

    margin-bottom: 80px;
}

.journey-description {

    line-height: 1.8;

   No fixed image height.
   No fixed aspect-ratio.

   Portrait images remain portrait.
   Landscape images remain landscape.

.gallery {

}

.gallery-overlay {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    padding: 24px;

    background:
        linear-gradient(
            to bottom,
            transparent 45%,
            rgba(0,0,0,.82)

    opacity: 0;

    transition:
        opacity .4s ease;
}

.gallery-number {

    color: var(--gold-light);

    font-family: var(--serif);

    font-size: 30px;
}

.gallery-open {

    color: var(--gold-light);

    font-size: 10px;

    letter-spacing: .2em;

    text-transform: uppercase;
}

.gallery-item:hover img {

    transform: scale(1.045);

    filter:

}

.gallery-item:hover .gallery-overlay {

}
